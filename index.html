<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title>Meme Generator</title>
</head>

<body onload="onInit()">

    <header>
    <h1>Meme Generator</h1>
</header>

    <main>
        <section class="gallery-section">
            <h2>Gallery</h2>
        </section>

        <section class="editor-section">
            <h2>Meme Editor</h2>
            <canvas width="500" height="500"></canvas>
            <input type="text" placeholder="Enter meme text" oninput="onSetLineTxt(this.value)">
        </section>
    </main>
    <script src="js/services/meme.service.js"></script>
    <script src="js/controllers/meme.controller.js"></script>
    <script src="js/controllers/gallery.controller.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
